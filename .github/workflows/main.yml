name: Build and Release YTMusicUltimate
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "URL to the decrypted IPA file (or set BASE_IPA_URL repo secret)"
        default: ""
        required: false
        type: string

      display_name:
        description: "App Name (Optional)"
        default: "YouTube Music"
        required: true
        type: string

      bundle_id:
        description: "BundleID (Optional)"
        default: "com.google.ios.youtubemusic"
        required: true
        type: string

env:
  IPA_URL: ${{ inputs.ipa_url || secrets.BASE_IPA_URL }}
  DISPLAY_NAME: ${{ inputs.display_name || 'YouTube Music' }}
  BUNDLE_ID: ${{ inputs.bundle_id || 'com.google.ios.youtubemusic' }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build YTMusicUltimate
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Main
        uses: actions/checkout@v6.0.2
        with:
          path: main
          submodules: recursive

      - name: Validate IPA URL
        run: |
          if [ -z "${{ env.IPA_URL }}" ]; then
            echo "::error::No base IPA URL. Pass ipa_url at dispatch or set the BASE_IPA_URL repo secret."
            exit 1
          fi
          curl -L -r 0-1023 -o sample.part "${{ env.IPA_URL }}" > /dev/null 2>&1
          
          file_type=$(file --mime-type -b sample.part)

          if [[ "$file_type" != "application/x-ios-app" && "$file_type" != "application/zip" ]]; then
            echo "::error::Validation failed: The file is not a valid IPA file. Detected type: $file_type."
            exit 1
          fi

      - name: Install Dependencies
        run: brew install make ldid

      - name: Set PATH environment variables
        run: |
          echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH
          echo "THEOS=${{ github.workspace }}/theos" >> $GITHUB_ENV

      - name: Cache Theos
        id: theos
        uses: actions/cache@v5.0.3
        env:
          cache-name: theos_cache_344ee59
        with:
          path: theos/
          key: ${{ env.cache-name }}
          restore-keys: ${{ env.cache-name }}

      - name: Setup Theos
        if: steps.theos.outputs.cache-hit != 'true'
        uses: actions/checkout@v6.0.2
        with:
          repository: theos/theos
          ref: 344ee5925df036dbd1312b783ad5a00d153c2445
          path: theos
          submodules: recursive

      - name: Download iOS SDK
        if: steps.theos.outputs.cache-hit != 'true'
        run: |
          git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/theos/sdks.git
          cd sdks
          git sparse-checkout set --no-cone iPhoneOS16.5.sdk
          git checkout
          mv *.sdk $THEOS/sdks

      - name: Install cyan
        run: pipx install --force https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip

      - name: Download YouTube Music
        run: wget "${{ env.IPA_URL }}" --no-verbose -O ytm.ipa

      - name: Build Tweak for Sideloading
        run: |
          cd main
          make clean package DEBUG=0 FINALPACKAGE=1 SIDELOADING=1
          mv packages/*.deb ../ytmult.deb

      - name: Inject tweak into provided IPA
        run: cyan -i ytm.ipa -o YTMusicUltimate.ipa -uwsf ytmult.deb -n "${{ env.DISPLAY_NAME }}" -b ${{ env.BUNDLE_ID }}

      - name: Mirror IPA to file host
        id: mirror
        env:
          FILE_FOLDER_ID: ${{ secrets.FILE_FOLDER_ID }}
        run: |
          UPLOAD_ARGS=(-F "file=@YTMusicUltimate.ipa;type=application/octet-stream")
          if [ -n "$FILE_FOLDER_ID" ]; then UPLOAD_ARGS+=(-F "folder=$FILE_FOLDER_ID"); fi
          HTTP_STATUS=$(curl -sSL -X POST https://file.chiuhuang.dev/api/public/upload "${UPLOAD_ARGS[@]}" \
            --max-time 900 --output mirror-response.txt --write-out '%{http_code}' || true)
          MIRROR_URL=$(python3 -c "import json; print(json.load(open('mirror-response.txt')).get('download_url',''))" 2>/dev/null || true)
          if [[ "$HTTP_STATUS" != 2?? || -z "$MIRROR_URL" ]]; then
            echo "::warning::Asia mirror unavailable (HTTP ${HTTP_STATUS:-request error}); continuing with the GitHub release download"
            MIRROR_URL=""
          else
            echo "::notice::Asia mirror: $MIRROR_URL"
          fi
          echo "url=$MIRROR_URL" >> "$GITHUB_OUTPUT"
          echo "MIRROR_URL=$MIRROR_URL" >> $GITHUB_ENV

      - name: Fetch server stats
        env:
          SERVER_HOOK_URL: ${{ secrets.SERVER_HOOK_URL }}
        run: |
          STATS_SECTION=""
          BASE="${SERVER_HOOK_URL%/api/app/release-hook}"
          if [ -n "$BASE" ]; then
            MD=$(curl -sL "$BASE/api/app/stats" --max-time 20 | python3 -c "import sys,json; print(json.load(sys.stdin).get('stats_md',''))") || true
            if [ -n "$MD" ]; then
              STATS_SECTION="### Stats"$'\n'"$MD"
            fi
          fi
          echo "STATS_SECTION<<EOF" >> $GITHUB_ENV
          echo "$STATS_SECTION" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v2.5.0
        with:
          tag_name: build-${{ github.run_number }}
          name: YTMusicUltimate (Build ${{ github.run_number }})
          files: |
            YTMusicUltimate.ipa
            main/Resources/icon.png
          draft: false
          body: |
            <div align="center">
              <img src="https://github.com/${{ github.repository }}/releases/download/build-${{ github.run_number }}/icon.png" width="128" height="128" alt="YTMusicUltimate Icon">
              <h2>YTMusicUltimate</h2>
            </div>

            Hello! Here is the latest automated build of YTMusicUltimate :3

            > **Before v1.0:** builds land fast, so expect the updater to ask you to reinstall often. It settles down after v1.0.

            ### 📦 Downloads
            - **[Cloudflare CDN](https://proxy.chiuhuang.dev/https://github.com/ChiuHuang/YTMult-with-better-lyrics/releases/download/build-${{ github.run_number }}/YTMusicUltimate.ipa)**
            ${{ steps.mirror.outputs.url != '' && format('- **[Asia Mirror]({0})**', steps.mirror.outputs.url) || '' }}

            ${{ env.STATS_SECTION }}

            ### 📡 Sideload
            <h3 align="center">
            <a href="https://altdirect.app/?url=https://ytmtranslate.chiuhuang.dev/api/app/altstore"><img src="https://altdirect.app/assets/png/AltSource_Blue.png" width="200"></a>
            &nbsp;
            ${{ steps.mirror.outputs.url != '' && format('<a href="{0}"><img src="https://altdirect.app/assets/png/Download_Blue.png" width="200"></a>', steps.mirror.outputs.url) || '' }}
            </h3>

            ---
            *Build: `#${{ github.run_number }}` • App Name: `${{ env.DISPLAY_NAME }}` • Bundle: `${{ env.BUNDLE_ID }}`*

      - name: Notify server webhook
        env:
          SERVER_HOOK_URL: ${{ secrets.SERVER_HOOK_URL }}
          HOOK_SECRET: ${{ secrets.HOOK_SECRET }}
          MIRROR_URL: ${{ steps.mirror.outputs.url }}
        run: |
          if [ -z "$SERVER_HOOK_URL" ] || [ -z "$HOOK_SECRET" ]; then
            echo "::warning::SERVER_HOOK_URL/HOOK_SECRET not set, skipping webhook (server falls back to GitHub API polling)"
            exit 0
          fi
          IPA_SIZE=$(stat -f%z YTMusicUltimate.ipa 2>/dev/null || stat -c%s YTMusicUltimate.ipa)
          python3 -c "import json,os; print(json.dumps({
            'tag': 'build-${{ github.run_number }}',
            'download_url': 'https://github.com/${{ github.repository }}/releases/download/build-${{ github.run_number }}/YTMusicUltimate.ipa',
            'asia_url': os.environ.get('MIRROR_URL') or None,
            'size': int('$IPA_SIZE'),
            'icon_url': 'https://github.com/${{ github.repository }}/releases/download/build-${{ github.run_number }}/icon.png',
          }))" > hook.json
          curl -sL -X POST "$SERVER_HOOK_URL" \
            -H "X-YTMU-Hook: $HOOK_SECRET" \
            -H "Content-Type: application/json" \
            --data @hook.json --max-time 30
          echo ""
          echo "::notice::Server webhook notified"

      - name: Output Release URL
        run: |
          echo "::notice::Release available at: https://github.com/${{ github.repository }}/releases"
