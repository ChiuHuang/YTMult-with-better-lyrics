<svg xmlns="http://www.w3.org/2000/svg" width="94" height="32" viewBox="0 0 94 32" role="img" aria-label="iOS 13 plus">
  <style>
    .bg { fill: #D3E3FD; }
    .fg { fill: #041E49; font-family: Roboto, -apple-system, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 500; }
    .chip { fill: #041E49; }
    .glyph { stroke: #D3E3FD; stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #004A77; }
      .fg { fill: #D3E3FD; }
      .chip { fill: #D3E3FD; }
      .glyph { stroke: #004A77; }
    }
  </style>
  <rect class="bg" width="94" height="32" rx="16"/>
  <circle class="chip" cx="16" cy="16" r="12"/>
  <g transform="translate(9,9)">
    <rect class="glyph" x="4" y="1" width="6" height="12" rx="1.5"/>
    <line class="glyph" x1="6.2" y1="3" x2="7.8" y2="3"/>
  </g>
  <text class="fg" x="33" y="20.5">iOS 13+</text>
</svg>
