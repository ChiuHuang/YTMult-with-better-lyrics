<svg xmlns="http://www.w3.org/2000/svg" width="112" height="32" viewBox="0 0 112 32" role="img" aria-label="Lyrics API">
  <style>
    .bg { fill: #D3E3FD; }
    .fg { fill: #041E49; font-family: Roboto, -apple-system, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 500; }
    .chip { fill: #041E49; }
    .glyph { stroke: #D3E3FD; stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #004A77; }
      .fg { fill: #D3E3FD; }
      .chip { fill: #D3E3FD; }
      .glyph { stroke: #004A77; }
    }
  </style>
  <rect class="bg" width="112" height="32" rx="16"/>
  <circle class="chip" cx="16" cy="16" r="12"/>
  <g transform="translate(9,9)">
    <rect class="glyph" x="2.5" y="2.5" width="9" height="3.6" rx="1"/>
    <rect class="glyph" x="2.5" y="7.9" width="9" height="3.6" rx="1"/>
    <circle class="glyph" cx="4.6" cy="4.3" r="0.4"/>
    <circle class="glyph" cx="4.6" cy="9.7" r="0.4"/>
  </g>
  <text class="fg" x="33" y="20.5">Lyrics API</text>
</svg>
