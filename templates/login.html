<!DOCTYPE html>
<html lang="en" class="mdui-theme-auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YTMusicUltimate - Admin</title>
<link rel="stylesheet" href="{{ url_for('static', filename='mdui/mdui.css') }}">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='dash.css') }}">
<style>
.auth-wrap { min-height:100vh; display:grid; place-items:center; padding:24px; position:relative; overflow:hidden; }
.auth-blob { position:absolute; width:420px; height:420px; border-radius:50%; filter: blur(80px); opacity:.35; pointer-events:none; }
.blob-a { background: rgb(var(--mdui-color-primary)); top:-120px; right:-80px; animation: drift 9s ease-in-out infinite alternate; }
.blob-b { background: rgb(var(--mdui-color-tertiary)); bottom:-140px; left:-100px; animation: drift 11s ease-in-out infinite alternate-reverse; }
@keyframes drift { from { transform: translate(0,0) scale(1); } to { transform: translate(30px,20px) scale(1.15); } }
.auth-card { width:100%; max-width:400px; position:relative; z-index:1; }
.auth-card mdui-card { padding:28px; animation: rise .45s var(--mdui-motion-easing-emphasized-decelerate); }
.auth-logo { width:56px; height:56px; border-radius:50%; display:grid; place-items:center; font-weight:700; font-size:22px; background: rgb(var(--mdui-color-primary)); color: rgb(var(--mdui-color-on-primary)); margin-bottom:10px; }
.auth-title { font-size:22px; font-weight:500; }
.auth-sub { font-size:13px; color: rgb(var(--mdui-color-on-surface-variant)); margin:2px 0 18px; }
.auth-form { display:flex; flex-direction:column; gap:14px; }
.auth-error { font-size:13px; color: rgb(var(--mdui-color-error)); background: rgba(var(--mdui-color-error-container),.5); padding:10px 12px; border-radius: var(--mdui-shape-corner-extra-small); }
</style>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-blob blob-a"></div>
  <div class="auth-blob blob-b"></div>
  <div class="auth-card">
    <mdui-card variant="elevated">
      <div class="auth-logo">YT</div>
      <div class="auth-title">Sign in</div>
      <div class="auth-sub">YTMusicUltimate admin dashboard</div>
      {% if error %}<div class="auth-error">{{ error }}</div>{% endif %}
      <form class="auth-form" id="login-form" method="post" action="/login">
        <mdui-text-field id="pw" name="password" label="Password" type="password" variant="outlined" required></mdui-text-field>
        <mdui-button variant="filled" type="submit" icon="login">Sign in</mdui-button>
      </form>
    </mdui-card>
  </div>
</div>
<script src="{{ url_for('static', filename='mdui/mdui.global.js') }}"></script>
<script>
(function () {
  var form = document.getElementById('login-form');
  var pw = document.getElementById('pw');
  var btn = document.querySelector('#login-form mdui-button');
  if (pw) pw.focus();
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    btn.loading = true;
    fetch('/login', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: 'password=' + encodeURIComponent(pw.value)
    }).finally(function () {
      window.location.reload();
    });
  });
})();
</script>
</body>
</html>
